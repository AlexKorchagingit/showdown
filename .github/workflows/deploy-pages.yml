name: Deploy GitHub Pages

on:
  push:
    branches: [main, cursor/poker-tma-mvp-47c2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build:pages
      - run: cp dist/index.html dist/404.html

      # Repo Pages source is the legacy `gh-pages` branch (not Actions artifact deploy).
      # The github-pages environment only allows that branch, so we publish here.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
