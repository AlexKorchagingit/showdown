# Isolated public-gateway route for the Bryansk clone.
#
# Install this as a separate Nginx site on the gateway that owns the public IP.
# It only handles brn-origin.showdown-br.ru and does not replace any existing
# production server block.

map $http_upgrade $showdown_brn_gateway_connection {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $showdown_brn_gateway_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream showdown_brn_private_origin {
    server 10.102.2.22:80 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name brn-origin.showdown-br.ru;

    access_log /var/log/nginx/showdown-brn-gateway.access.log;
    error_log /var/log/nginx/showdown-brn-gateway.error.log warn;
    client_max_body_size 50m;

    location / {
        proxy_pass http://showdown_brn_private_origin;
        proxy_http_version 1.1;
        proxy_set_header Host brn-origin.showdown-br.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $showdown_brn_gateway_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $showdown_brn_gateway_connection;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
