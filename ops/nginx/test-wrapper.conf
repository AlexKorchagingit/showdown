# Syntax-check wrapper for the candidate virtual host on the production host.
# Copy this file and api.showdown-br.ru.conf to /tmp, then run:
# nginx -t -c /tmp/showdown-nginx-test-wrapper.conf

pid /tmp/showdown-nginx-test.pid;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    include /tmp/showdown-origin-nginx-candidate.conf;
}
