<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D99962"/>
      <stop offset="100%" stop-color="#F2D8A7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Top diamond chevrons ──────────────────────────────── -->
  <!-- Outer diamond -->
  <polygon points="50,4  62,18  50,28  38,18"
           fill="#0A0908" stroke="url(#gold)" stroke-width="1.8"/>
  <!-- Inner diamond -->
  <polygon points="50,10 58,18 50,25 42,18"
           fill="none"    stroke="url(#gold)" stroke-width="1" opacity="0.55"/>

  <!-- ── Main badge body ───────────────────────────────────── -->
  <!-- Outer ring -->
  <path d="M50 24
           L87 37 L94 55 L86 73 L72 88 L50 97
           L28 88 L14 73 L6 55  L13 37 Z"
        fill="#0A0908" stroke="url(#gold)" stroke-width="1.8"/>
  <!-- Middle ring -->
  <path d="M50 30
           L83 42 L89 57 L82 72 L69 85 L50 93
           L31 85 L18 72 L11 57 L17 42 Z"
        fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
  <!-- Inner fill -->
  <path d="M50 36
           L79 47 L84 59 L78 71 L67 82 L50 89
           L33 82 L22 71 L16 59 L21 47 Z"
        fill="#12100E" stroke="url(#gold)" stroke-width="0.8" opacity="0.4"/>

  <!-- ── Left wing ─────────────────────────────────────────── -->
  <path d="M13 37 L3  46 L6  55" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <path d="M13 37 L4  41"        fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.4"/>

  <!-- ── Right wing ────────────────────────────────────────── -->
  <path d="M87 37 L97 46 L94 55" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <path d="M87 37 L96 41"        fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.4"/>

  <!-- ── Ace of spades card (upper-left, rotated) ──────────── -->
  <g transform="translate(10,30) rotate(-14, 12, 13)">
    <rect width="22" height="28" rx="2.5"
          fill="#D8C5A6" stroke="#c8a38e" stroke-width="0.6" opacity="0.92"/>
    <text x="4"  y="10" fill="#0A0908" font-size="7"  font-weight="700" font-family="serif">A</text>
    <text x="11" y="22" fill="#0A0908" font-size="12" font-family="serif" text-anchor="middle">♠</text>
  </g>

  <!-- ── SD Monogram ───────────────────────────────────────── -->
  <text x="54" y="74"
        text-anchor="middle"
        fill="url(#gold)"
        font-size="34"
        font-weight="900"
        font-family="'Arial Black', 'Impact', sans-serif"
        letter-spacing="-3"
        filter="url(#glow)">SD</text>

  <!-- Thin baseline rule under SD -->
  <line x1="30" y1="79" x2="70" y2="79"
        stroke="url(#gold)" stroke-width="0.7" opacity="0.4"/>
</svg>
