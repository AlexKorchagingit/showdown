name: showdown-security-local
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_PASSWORD: showdown-local-test-only
      POSTGRES_DB: postgres
    volumes:
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 2s
      timeout: 2s
      retries: 30
  auth:
    image: supabase/gotrue:v2.189.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:55430/auth/v1
      GOTRUE_SITE_URL: http://127.0.0.1:5173
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:showdown-local-test-only@db:5432/postgres
      GOTRUE_JWT_SECRET: showdown-local-test-signing-key-never-use-in-production
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      # No mail provider: integration tests use generated links, never real email.
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:9999/health]
      interval: 2s
      timeout: 2s
      retries: 30
  rest:
    image: postgrest/postgrest:v14.12
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:showdown-local-test-only@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: showdown-local-test-signing-key-never-use-in-production
      PGRST_DB_MAX_ROWS: 1000
  gateway:
    image: nginx:1.28-alpine
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
    ports:
      - 127.0.0.1:55430:80
    networks: [default, ingress]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
networks:
  default:
    internal: true
  ingress:
    # Only the gateway joins this network; database/Auth stay internal-only.
    driver: bridge
